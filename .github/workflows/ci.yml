name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest tests
        run: npm test

      - name: Run mobile storage and auth tests
        run: npm run test:mobile

      - name: Check mobile types
        run: npm run typecheck --workspace @walquest/mobile

      - name: Lint mobile app
        run: npm run lint --workspace @walquest/mobile

      - name: Validate native JavaScript bundles (no EAS build)
        run: npx expo export --platform all
        working-directory: apps/mobile
